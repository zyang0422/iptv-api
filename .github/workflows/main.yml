名称：'更新计划': 'Update schedule'

在：:
  时间表：:
    - cron: '0 10,0,22 * * *'  # 每天北京时间 06:00  和 18:00 运行
  workflow_dispatch:  # 允许手动触发:  # 允许手动触发

权限：:
  内容：写: write
  操作：读取: read

并发：:
  组：iptv-update-${{ github.ref }}: iptv-update-${{ github.ref }}
  取消进行中：true: true

职位：:
  推送：:
    运行于: ${{ matrix.operating-system }}: ${{ matrix.operating-system }}
    超时分钟数: 60: 60
    策略：:
      矩阵：:
        操作系统: [ 'ubuntu-latest' ]: [ 'ubuntu-latest' ]
    步骤：:
      - 名称：设置分支名称name: Set branch name
        id: 变量: vars
        运行：echo "BRANCH_NAME=${{ github.repository_owner == 'Guovin' && 'gd' || 'master' }}" >> $GITHUB_ENV: echo "BRANCH_NAME=${{ github.repository_owner == 'Guovin' && 'gd' || 'master' }}" >> $GITHUB_ENV
      - 用法：actions/checkout@v6uses: actions/checkout@v6
        使用：:
          ref: ${{ env.BRANCH_NAME }}: ${{ env.BRANCH_NAME }}
          fetch-depth: 0: 0
      - name: 使用 setup-python 3.13 运行name: Run with setup-python 3.13
        使用：actions/setup-python@v5: actions/setup-python@v5
        使用：:
          python-version: '3.13': '3.13'
          更新环境：是: true
          缓存：'pip': 'pip'
          cache-dependency-path: 'Pipfile.lock'
      - name: Check open_driver config
        id: check_driver
        run: |
          echo "OPEN_DRIVER=$(python -c '
          try:
            from utils.config import config
            open_driver = config.open_driver
          except:
            open_driver = False
          print(open_driver)')" >> $GITHUB_ENV
      - name: Set up Chrome
        if: env.OPEN_DRIVER == 'True'
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable
      - name: Download chrome driver
        if: env.OPEN_DRIVER == 'True'
        uses: nanasess/setup-chromedriver@master
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install pipenv
        run: pip3 install --user pipenv
      - name: Install dependecies
        run: pipenv --python 3.13 && pipenv install --deploy
      - name: Install selenium
        if: env.OPEN_DRIVER == 'True'
        run: pipenv install selenium
      - name: Update
        run: pipenv run dev
      - name: Upload output artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: iptv-output
          path: |
            output/**
            output/log/**
            output/epg/**
          if-no-files-found: warn
          retention-days: 7
      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/** version.json || true
          if ! git diff --staged --quiet; then
            git commit -m "Github Action Auto Updated"
            git push
          fi
